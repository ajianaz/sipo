name: ci

on:
  push:
    branches: [develop]
    paths: ['app/**', '.github/workflows/ci.yml']
  pull_request:
    branches: [develop]
    paths: ['app/**', '.github/workflows/ci.yml']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: cd app && flutter pub get
      - run: cd app && dart format --set-exit-if-changed lib/ test/
      - run: cd app && flutter analyze --no-fatal-infos

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: cd app && flutter pub get
      - run: cd app && dart run build_runner build --delete-conflicting-outputs
      - run: cd app && flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: app/coverage/

  build-preview:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: cd app && flutter pub get

      - run: cd app && dart run build_runner build --delete-conflicting-outputs

      - name: Bump build number
        run: |
          cd app
          CURRENT_VERSION=$(grep 'version:' pubspec.yaml | head -1 | sed 's/version: //')
          CURRENT_MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          CURRENT_MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          CURRENT_PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3 | cut -d+ -f1)
          CURRENT_BUILD=$(echo "$CURRENT_VERSION" | cut -d+ -f2)

          # Count commits on develop since last tag
          if git describe --tags --match 'v*' --abbrev=0 2>/dev/null; then
            BUILD=$(git rev-list $(git describe --tags --match 'v*' --abbrev=0)..HEAD --count)
            BUILD=$((BUILD + CURRENT_BUILD))
          else
            BUILD=${{ github.run_number }}
          fi

          NEW_VERSION="${CURRENT_MAJOR}.${CURRENT_MINOR}.${CURRENT_PATCH}+${BUILD}"

          echo "Current: $CURRENT_VERSION"
          echo "New: $NEW_VERSION"

          sed -i "s/^version: .*/version: ${NEW_VERSION}/" pubspec.yaml
          echo "VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"

      - name: Build APK
        run: cd app && flutter build apk --release

      - name: Rename APK
        run: |
          VERSION_NO_BUILD=$(echo "$VERSION" | cut -d+ -f1)
          mv app/build/app/outputs/flutter-apk/app-release.apk \
            app/build/app/outputs/flutter-apk/sipo-dev-${VERSION}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sipo-dev-preview
          path: app/build/app/outputs/flutter-apk/sipo-dev-${{ env.VERSION }}.apk
          retention-days: 30

      - name: Comment version info
        run: |
          echo "## 📱 Dev Preview Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** \`${{ env.VERSION }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download APK dari **Actions → Artifacts → sipo-dev-preview**" >> "$GITHUB_STEP_SUMMARY"

  deploy-web:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: cd app && flutter pub get
      - run: cd app && dart run build_runner build --delete-conflicting-outputs

      - name: Enable web platform
        run: cd app && flutter create . --platforms web

      - name: Build Web
        run: cd app && flutter build web --release --base-href "/"

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest pages deploy app/build/web --project-name=sipo --commit-dirty=true 2>&1 | tee deploy-output.txt
          URL=$(grep -oP 'https://[a-f0-9]+\.\w+\.pages\.dev' deploy-output.txt | head -1)
          echo "deployment-url=$URL" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "## 🌐 Web Preview Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

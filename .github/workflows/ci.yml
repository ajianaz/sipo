name: ci

on:
  push:
    branches: [develop]
    paths: ['app/**']
  pull_request:
    branches: [develop]
    paths: ['app/**']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: cd app && flutter pub get
      - run: cd app && dart format --set-exit-if-changed lib/ test/
      - run: cd app && flutter analyze --no-fatal-infos

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: cd app && flutter pub get
      - run: cd app && dart run build_runner build --delete-conflicting-outputs
      - run: cd app && flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: app/coverage/

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: cd app && flutter pub get
      - run: cd app && dart run build_runner build --delete-conflicting-outputs
      - run: cd app && flutter build apk --release
      - name: Rename APK with short SHA
        run: |
          mv app/build/app/outputs/flutter-apk/app-release.apk \
            app/build/app/outputs/flutter-apk/sipo-dev-${GITHUB_SHA::7}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/app/outputs/flutter-apk/sipo-dev-${GITHUB_SHA::7}.apk
